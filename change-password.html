<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password — TEEMON</title>
  <link rel="stylesheet" href="styles.css?v=20260803-10">
</head>
<body>
  <main class="login-page">
    <form id="changePasswordForm" class="login-card">
      <a href="index.html" class="brand"><span class="mark">T</span> TEEMON</a>
      <p class="eyebrow">Account security</p>
      <h1>Create your password.</h1>
      <p class="passwordRules">Your administrator issued an initial password. Choose a new password of at least 8 characters before continuing.</p>
      <label>New password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label>
      <p id="changePasswordMessage" role="status"></p>
      <button class="button primary" type="submit">Change password →</button>
    </form>
  </main>
  <script type="module" src="js/change-password.js"></script>
</body>
</html>
